# GitLab is the main repository; GitHub (github.com/doc-biddle/<project>) is a mirror.
#
# check:       on every push to main and every version tag, luacheck (.luacheckrc: only game functions the real
#              client has) and the tests (lua5.1 tests/run.lua, a fake game). If either fails, nothing below runs:
#              no mirror update, no release.
# github-sync: every push to main is copied to GitHub.
# package:     a version tag such as v1.2.3
#   1. is pushed to GitHub,
#   2. is built with the BigWigs packager (https://github.com/BigWigsMods/packager) into
#      <Addon>-<tag>-forever.zip (addon folder at the root), which the packager uploads to CurseForge
#      (toc "## X-Curse-Project-ID" + CF_API_TOKEN).
#   3. gets a GitLab release with the zip and release.json, for the WowUp Hub.
#   4. gets a GitHub release with the same files. It is made as a draft, the files are attached, it
#      is published, and 3 minutes later it is saved once more, unchanged. Wago (which imports GitHub
#      releases through its GitHub webhook) ignores the publish of a release that began as a draft, but
#      imports on that later save, once, with the files already in place.
#
# CI/CD variables (masked, NOT protected): GH_API_TOKEN (GitHub token with Contents read/write on the
# mirror) and CF_API_TOKEN (CurseForge API token). Without one, that step is skipped.

variables:
  GITHUB_REPO: "doc-biddle/$CI_PROJECT_NAME"
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

stages:
  - check
  - publish

check:
  stage: check
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends lua5.1 lua-check > /dev/null
    - luacheck .
    - lua5.1 tests/run.lua

github-sync:
  stage: publish
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GH_API_TOKEN'
  script:
    - git push "https://x-access-token:${GH_API_TOKEN}@github.com/${GITHUB_REPO}.git" "HEAD:refs/heads/main"

package:
  stage: publish
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  script:
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends bash git curl zip jq ca-certificates > /dev/null
      curl -sSfL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh

      # The tag goes to GitHub first, for the GitHub release below.
      if [ -n "${GH_API_TOKEN:-}" ]; then
        git push "https://x-access-token:${GH_API_TOKEN}@github.com/${GITHUB_REPO}.git" "refs/tags/$CI_COMMIT_TAG"
      fi
      # The packager runs without a GitHub token, so it builds the zip and uploads it to CurseForge but
      # makes no GitHub release: its release is published before the zip is attached, and the extra
      # notice that took to reach Wago made Wago import some releases twice.
      env -u GH_API_TOKEN -u GITHUB_API_TOKEN -u GITHUB_OAUTH bash /tmp/release.sh

      ZIP=$(ls .release/*.zip | head -n 1); NAME=$(basename "$ZIP")
      TOC=$(ls *.toc | head -n 1)
      INTERFACE=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' "$TOC" | head -n 1)
      PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG"
      jq -n --arg n "$CI_PROJECT_NAME" --arg v "$CI_COMMIT_TAG" --arg f "$NAME" --argjson i "$INTERFACE" \
        '{releases:[{name:$n,version:$v,filename:$f,nolib:false,metadata:[{flavor:"forever",interface:$i}]}]}' > release.json
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$ZIP" "$PKG/$NAME"
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file release.json "$PKG/release.json"

      V="${CI_COMMIT_TAG#v}"
      NOTES=$(awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md)
      jq -n --arg t "$CI_COMMIT_TAG" --arg name "$CI_PROJECT_NAME $V" --arg d "$NOTES" --arg z "$NAME" \
        --arg zu "$PKG/$NAME" --arg ju "$PKG/release.json" \
        '{tag_name:$t,name:$name,description:$d,assets:{links:[{name:$z,url:$zu,link_type:"package"},{name:"release.json",url:$ju,link_type:"other"}]}}' > payload.json
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" --data @payload.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

      # GitHub release: a draft with the zip and release.json attached, then published, then saved again
      # unchanged after 3 minutes. Wago doesn't import on the publish of a release that started as a
      # draft (seen with HoverWise 1.1.2); it does import on the later save.
      if [ -n "${GH_API_TOKEN:-}" ]; then
        GH_API="https://api.github.com/repos/${GITHUB_REPO}/releases"
        GH_UPLOADS="https://uploads.github.com/repos/${GITHUB_REPO}/releases"
        AUTH="Authorization: Bearer $GH_API_TOKEN"
        ACCEPT="Accept: application/vnd.github+json"
        jq -n --arg t "$CI_COMMIT_TAG" --arg b "$NOTES" '{tag_name:$t,name:$t,body:$b,draft:true}' > gh_release.json
        REL_ID=$(curl -sSf -H "$AUTH" -H "$ACCEPT" --data @gh_release.json "$GH_API" | jq -r .id)
        for F in "$ZIP" release.json; do
          curl -sSf -o /dev/null -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/octet-stream" \
            --data-binary @"$F" "$GH_UPLOADS/$REL_ID/assets?name=$(basename "$F")"
          echo "Attached $(basename "$F") to the draft GitHub release."
        done
        curl -sSf -o /dev/null -X PATCH -H "$AUTH" -H "$ACCEPT" --data '{"draft":false,"make_latest":"true"}' "$GH_API/$REL_ID"
        echo "Published the GitHub release: https://github.com/${GITHUB_REPO}/releases/tag/$CI_COMMIT_TAG"
        sleep 180
        curl -sSf -o /dev/null -X PATCH -H "$AUTH" -H "$ACCEPT" --data '{"make_latest":"true"}' "$GH_API/$REL_ID"
        echo "Saved the GitHub release again, for Wago."
      fi
