# GitLab is the main repository; GitHub (github.com/doc-biddle/<project>) is a mirror.
#
# github-sync: every push to main is copied to GitHub.
# package:     a version tag such as v1.2.3
#   1. is pushed to GitHub,
#   2. is built with the BigWigs packager (https://github.com/BigWigsMods/packager) into
#      <Addon>-<tag>-forever.zip (addon folder at the root), and the packager publishes the GitHub
#      release with release.json. Wago imports that GitHub release through its GitHub webhook.
#   3. gets a GitLab release with the same zip and release.json, for the WowUp Hub.
#
# CI/CD variables (masked, NOT protected): GH_API_TOKEN (GitHub token with Contents read/write on the
# mirror). Without it, the GitHub steps are skipped.

variables:
  GITHUB_REPO: "doc-biddle/$CI_PROJECT_NAME"
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

github-sync:
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GH_API_TOKEN'
  script:
    - git push "https://x-access-token:${GH_API_TOKEN}@github.com/${GITHUB_REPO}.git" "HEAD:refs/heads/main"

package:
  image: debian:bookworm-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  script:
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends bash git curl zip jq ca-certificates > /dev/null
      curl -sSfL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh

      # The packager publishes the GitHub release for the repo in the "origin" remote.
      if [ -n "${GH_API_TOKEN:-}" ]; then
        git push "https://x-access-token:${GH_API_TOKEN}@github.com/${GITHUB_REPO}.git" "refs/tags/$CI_COMMIT_TAG"
        git remote set-url origin "https://github.com/${GITHUB_REPO}.git"
      fi
      bash /tmp/release.sh

      ZIP=$(ls .release/*.zip | head -n 1); NAME=$(basename "$ZIP")
      TOC=$(ls *.toc | head -n 1)
      INTERFACE=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' "$TOC" | head -n 1)
      PKG="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG"
      jq -n --arg n "$CI_PROJECT_NAME" --arg v "$CI_COMMIT_TAG" --arg f "$NAME" --argjson i "$INTERFACE" \
        '{releases:[{name:$n,version:$v,filename:$f,nolib:false,metadata:[{flavor:"forever",interface:$i}]}]}' > release.json
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$ZIP" "$PKG/$NAME"
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file release.json "$PKG/release.json"

      V="${CI_COMMIT_TAG#v}"
      NOTES=$(awk -v v="$V" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md)
      jq -n --arg t "$CI_COMMIT_TAG" --arg name "$CI_PROJECT_NAME $V" --arg d "$NOTES" --arg z "$NAME" \
        --arg zu "$PKG/$NAME" --arg ju "$PKG/release.json" \
        '{tag_name:$t,name:$name,description:$d,assets:{links:[{name:$z,url:$zu,link_type:"package"},{name:"release.json",url:$ju,link_type:"other"}]}}' > payload.json
      curl -sSf -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" --data @payload.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
